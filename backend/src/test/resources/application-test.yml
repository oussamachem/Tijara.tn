spring:
  # La datasource est fournie dynamiquement par Testcontainers (cf. AbstractPostgresIT).
  # Pas de Redis en test : cache desactive.
  cache:
    type: none
  jpa:
    hibernate:
      # Hibernate genere le schema dans le conteneur Postgres a chaque contexte de test
      # -> valide directement le mapping des entites contre un vrai PostgreSQL.
      ddl-auto: create-drop
    open-in-view: false

app:
  # Images uploadees pendant les tests sous target/ (nettoye par mvn clean, hors sources).
  uploads-dir: target/test-uploads
  seed:
    admin-email: admin@smartboutique.com
    admin-password: Admin@123
    admin-name: Administrateur
  jwt:
    secret: test-secret-key-test-secret-key-test-secret-key-0123456789
    expiration-ms: 3600000
  password-reset:
    expiration-ms: 1800000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.smartboutique: WARN
