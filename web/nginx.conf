# Scheme public reel : derriere Cloudflare Tunnel, cloudflared envoie X-Forwarded-Proto=https ;
# en acces direct (LAN http) l'en-tete est absent -> on retombe sur le scheme reel ($scheme).
map $http_x_forwarded_proto $public_proto {
    default $scheme;
    "https" "https";
    "http"  "http";
}

server {
    # default_server : sert quel que soit le Host (xxx.trycloudflare.com, IP LAN, localhost...).
    listen 80 default_server;
    server_name _;

    # Doit etre >= a la limite d'upload du backend (5 Mo) sinon 413 sur les images.
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend (le chemin /api/... est conserve).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Propage le scheme PUBLIC (https via le tunnel) + l'hote public -> le backend
        # reconstruit https://<hote-public> et voit les requetes front->API comme meme origine.
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Images produits uploadees -> servies par le backend (volume monte cote backend).
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA React : toute route inconnue renvoie index.html (sinon F5 sur /produits = 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
