server {
    listen 80;
    server_name _;

    # Doit etre >= a la limite d'upload du backend (5 Mo) sinon 413 sur les images.
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend (le chemin /api/... est conserve).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images produits uploadees -> servies par le backend (volume monte cote backend).
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA React : toute route inconnue renvoie index.html (sinon F5 sur /produits = 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
