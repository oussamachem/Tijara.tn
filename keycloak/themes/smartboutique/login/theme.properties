# Thème de connexion « Smart Boutique » — moderne, hérite de la logique du thème keycloak
# (toutes les pages : login, register, reset password, OTP, erreurs) et restyle intégralement en CSS.
parent=keycloak
import=common/keycloak

# On REMPLACE la feuille de styles par la nôtre (styling complet, indépendant de PatternFly).
styles=css/login.css

# Classes appliquées aux conteneurs pour un ciblage CSS stable.
kcHtmlClass=sb-html
kcBodyClass=sb-body
kcLoginClass=sb-login

# Cases à cocher / champs : on garde les classes par défaut, restylées via login.css.
