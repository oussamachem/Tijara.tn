# ===========================================================================
# Smart Boutique - orchestration de production (postgres + backend + web/nginx).
# Lancement : cp .env.example .env  (remplir les secrets)  puis  docker compose up --build
# Le mobile n'est PAS conteneurise (artefact Expo/EAS, cf. mobile/README.md).
# ===========================================================================
services:

  postgres:
    image: postgres:16
    container_name: sb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_boutique}
      POSTGRES_USER: ${POSTGRES_USER:-smartboutique}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    ports:
      # Expose sur le port host 5544 pour coexister avec un PostgreSQL local sur 5432.
      # (En interne, les conteneurs joignent toujours "postgres:5432".)
      - "5544:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartboutique} -d ${POSTGRES_DB:-smart_boutique}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sb-redis
    restart: unless-stopped
    # Plafond memoire 500 Mo + eviction LRU ; pas de persistance disque (cache pur).
    command: ["redis-server", "--maxmemory", "500mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Stockage objet S3 auto-heberge (compatible AWS S3). Bucket persiste sur un volume.
  minio:
    image: minio/minio:latest
    container_name: sb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY requis}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY requis (>= 8 caracteres)}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    ports:
      # Console web MinIO (admin des buckets). Optionnel en prod.
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Base PostgreSQL DEDIEE a Keycloak (isolee de la base applicative).
  keycloak-db:
    image: postgres:16
    container_name: sb-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD requis}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak (IAM/OIDC) : realm 'smartboutique' importe au demarrage (roles + client web).
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: sb-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    # start-dev : demarrage simple + import du realm. (Prod stricte : passer a 'start' + hostname/HTTPS.)
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD requis}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-smartboutique.json:/opt/keycloak/data/import/realm-smartboutique.json:ro
      # Thème de connexion « Smart Boutique » (moderne). Le realm référence loginTheme=smartboutique.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      # Console admin + endpoints OIDC de Keycloak.
      - "8081:8080"

  backend:
    build: ./backend
    container_name: sb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Prod : pas de donnees de demo (le seeder de categories globales est incompatible avec le
      # schema multi-tenant V22 : categories.boutique_id NOT NULL). L'admin plateforme est provisionne
      # a la volee (JIT) a la 1re connexion Keycloak (role realm admin -> platformAdmin).
      SEED_DEMO_DATA: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Stockage images = S3 (MinIO). Passer STORAGE=local pour revenir au disque.
      STORAGE: ${STORAGE:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-sb-images}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY requis}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY requis}
      S3_PATH_STYLE: "true"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smart_boutique}
      # Owner du schema : Flyway (DDL, creation du role sb_app, policies RLS).
      DB_USERNAME: ${POSTGRES_USER:-smartboutique}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      # Role applicatif NON-SUPERUSER pour le runtime (la RLS mord). Cree par Flyway V9.
      APP_DB_USERNAME: ${APP_DB_USERNAME:-sb_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD requis (role runtime sb_app)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (>= 32 caracteres)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Keycloak (OIDC). ISSUER = URL PUBLIQUE (doit matcher le claim iss des tokens emis cote
      # navigateur). JWKS = URL INTERNE (le backend joint Keycloak par le reseau Docker). Les deux
      # peuvent differer : l'issuer est valide par comparaison de chaine, les cles viennent du realm.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8081/realms/smartboutique}
      KEYCLOAK_JWKS: ${KEYCLOAK_JWKS:-http://keycloak:8080/realms/smartboutique/protocol/openid-connect/certs}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090,http://localhost:8091}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smartboutique.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD requis}
      ADMIN_NAME: ${ADMIN_NAME:-Administrateur}
      # SUPER_ADMIN plateforme (gestion des boutiques).
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@smartboutique.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD requis}
    # Pas de port publie : le backend n'est joignable que via nginx (proxy /api, /uploads).
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./web
      args:
        # URL PUBLIQUE de Keycloak (redirection login SSO cote navigateur). Defaut local :8081.
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
    container_name: sb-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Web ADMIN servi par nginx. 8090 sur l'hote pour eviter les conflits ; 80/443 en prod reelle.
      - "8090:80"

  web-client:
    build:
      context: ./web-client
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
    container_name: sb-web-client
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Marketplace CLIENT (app separee). 8091 sur l'hote.
      - "8091:80"

volumes:
  pg_data:
  uploads_data:
  minio_data:
  keycloak_db_data:
